# Правила модерации. Скопируйте в rules.toml и поправьте под свой чат.
# Шаблоны — регулярные выражения, регистр не важен. Текст перед проверкой
# очищается от подмены букв: «з@работок» и «kазино» с латинскими буквами тоже найдутся.

[filters]
# сообщение удаляется, автор получает бан
ban_patterns = [
  "заработ\\w*.{0,30}(в день|в неделю|без вложений)",
  "(пиши|писать|обращайся)\\w* в (лс|личку|личные)",
  "казино|ставки на спорт|букмекер",
  "t\\.me/\\+",                        # приглашения в закрытые каналы
]
# сообщение просто удаляется
hide_patterns = [
  "(?:бесплатн\\w+|дешёв\\w+) (?:подписчик|лайк)\\w*",
  "\\b(?:хуй|пизд|еба)\\w*",
]
# бан по имени, фамилии или @нику — сразу при входе в чат
name_ban_patterns = ["crypto.?signal", "заработ", "инвест.?помощ"]

[behaviour]
chat_ids = []                       # id групп для модерации; пусто — все, где бот админ
notify_chat = 0                     # id чата для отчётов (0 — не слать)
admins_exempt = true                # админов не трогаем
delete_forwards = true              # пересланные сообщения удаляются
allowed_attachments = ["photo", "video", "animation", "sticker"]
newbie_hours = 24                   # новичкам первые сутки нельзя ссылки и @каналы
captcha = true                      # новичок должен нажать «Я человек»
captcha_seconds = 120
flood_messages = 5                  # больше 5 сообщений за 10 секунд — мут на 30 минут
flood_seconds = 10
flood_mute_minutes = 30
